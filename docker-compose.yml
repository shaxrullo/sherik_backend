services:
  db:
    image: postgres:16
    container_name: sherik_postgres
    restart: always
    environment:
      POSTGRES_DB: sherik_db
      POSTGRES_USER: sherik_user
      POSTGRES_PASSWORD: sherik_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

