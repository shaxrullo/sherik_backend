name: Deploy to Render

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sherik_test
          POSTGRES_USER: sherik_user
          POSTGRES_PASSWORD: test_password_12345
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create pytest config
        run: |
          cat > pytest.ini << 'EOF'
          [pytest]
          DJANGO_SETTINGS_MODULE = config.settings
          python_files = tests.py test_*.py *_tests.py
          testpaths = listings/tests.py favorites/tests.py reports/tests.py matching/tests.py
          EOF
      
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://sherik_user:test_password_12345@localhost:5432/sherik_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
        run: python manage.py migrate --noinput
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://sherik_user:test_password_12345@localhost:5432/sherik_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
        run: |
          pytest --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
            echo "Deployment triggered on Render"
          else
            echo "Warning: RENDER_DEPLOY_HOOK_URL not configured"
          fi
      
      - name: Notify deployment
        run: |
          echo "✅ Application deployed to production!"
          echo "Check Render dashboard for deployment status"
