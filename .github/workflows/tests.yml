name: Tests & Quality Checks

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Use PostgreSQL service for testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sherik_test
          POSTGRES_USER: sherik_user
          POSTGRES_PASSWORD: test_password_12345
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Create pytest.ini if it doesn't exist
      - name: Create pytest config
        run: |
          cat > pytest.ini << 'EOF'
          [pytest]
          DJANGO_SETTINGS_MODULE = config.settings
          python_files = tests.py test_*.py *_tests.py
          testpaths = listings/tests.py favorites/tests.py reports/tests.py matching/tests.py
          EOF
      
      # Run code formatting check (Black)
      - name: Check code formatting with Black
        run: |
          black --check . --exclude venv,migrations || echo "Files need formatting"
        continue-on-error: true
      
      # Run import sorting check (isort)
      - name: Check import ordering with isort
        run: |
          isort --check . --exclude venv,migrations || echo "Imports need sorting"
        continue-on-error: true
      
      # Run linting (flake8)
      - name: Lint with flake8
        run: |
          flake8 listings/ favorites/ reports/ matching/ users/ config/ \
            --max-line-length=100 \
            --exclude=migrations,__pycache__,.venv \
            --ignore=E203,W503,E501 || echo "Linting issues found"
        continue-on-error: true
      
      # Run security checks (bandit)
      - name: Security check with bandit
        run: |
          bandit -r listings/ favorites/ reports/ matching/ users/ config/ \
            -ll -v || echo "Security issues found"
        continue-on-error: true
      
      # Run database migrations
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://sherik_user:test_password_12345@localhost:5432/sherik_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
        run: |
          python manage.py migrate --noinput
      
      # Run tests with coverage
      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql://sherik_user:test_password_12345@localhost:5432/sherik_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
        run: |
          pytest --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70 \
            -v \
            --tb=short
      
      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      # Store coverage report
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
      
      # Comment on PR with test results (optional)
      - name: PR Comment with test summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Test Results\n\n';
            comment += '✅ Python ${{ matrix.python-version }} tests completed\n';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  # Code quality status check
  quality:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All quality checks passed!"
